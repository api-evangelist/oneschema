    Template:
      type: object
      required:
      - name
      - template_key
      - columns
      properties:
        name:
          type: string
          examples:
          - template_name
        template_key:
          type: string
          examples:
          - template_key
        description:
          type: string
        columns:
          type: array
          items:
            $ref: '#/components/schemas/TemplateColumn'
          description: The template columns that define the template schema.
        validation_hooks:
          type: array
          items:
            $ref: '#/components/schemas/ValidationHook'
          description: The webhook definitions for any validation webhooks attached to this template.
        code_hooks:
          type: array
          items:
            type: string
          description: Template hooks attached to the template. Note this format will soon be deprecated
            in favor of the `hooks` field.
        hooks:
          allOf:
          - $ref: '#/components/schemas/TemplateHooksByStage'
          description: Template hooks attached to the template. Note this format will take precedence
            over the `code_hooks` field.
    TemplateColumn:
      type: object
      required:
      - label
      - key
      properties:
        label:
          type: string
          examples:
          - template_column_name
        key:
          type: string
          examples:
          - template_column_key
        data_type:
          type: string
          enum:
          - PICKLIST
          - NUMBER
          - PERCENTAGE
          - DATE_MDY
          - DATE_DMY
          - DATE_ISO
          - DATETIME_ISO
          - DATETIME_MDYHM
          - DATETIME_DMYHM
          - DATE_YMD
          - DATE_DMMMY
          - TIME_HHMM
          - UNIX_TIMESTAMP
          - URL
          - DOMAIN
          - FULL_NAME
          - EMAIL
          - UNIT_OF_MEASURE
          - CURRENCY_CODE
          - PHONE_NUMBER
          - US_PHONE_NUMBER_EXT
          - MONEY
          - IANA_TIMEZONE
          - CUSTOM_REGEX
          - ALPHABETICAL
          - TEXT
          - SSN_MASKED
          - SSN_UNMASKED
          - FILE_NAME
          - UUID
          - JSON
          - BOOLEAN
          - UPC_A
          - EAN
          - IMEI
          - ENUM_US_STATE_TERRITORY
          - ENUM_COUNTRY
          description: Validation type to check all values in the column.
        description:
          type: string
          description: A free-form description of this template column.
        must_exist:
          type: boolean
          description: Validation to check if a template column does not exist in the spreadsheet.
          default: false
        is_required:
          type: boolean
          description: Validation to check that a column has no empty values.
          default: false
        is_unique:
          type: boolean
          description: Validation to check that a column has no duplicate values.
          default: false
        is_custom:
          type: boolean
          description: Specification for whether the template column is a custom column. Custom Columns
            can be mapped multiple times and will retain the initial sheet header on import (as opposed
            to being replaced with the template column name).
          default: false
        is_locked:
          type: boolean
          description: Users will not be able to edit data mapped to this column on the Review & finalize
            step.
          default: false
        is_multi_mappable:
          type: boolean
          description: Users will be able to map multiple columns to this template column.
          default: false
        is_hidden:
          type: boolean
          description: This column will be hidden in the Review & finalize step.
          default: false
        is_unmappable:
          type: boolean
          description: Users will not be able to map to this column.
          default: false
        validation_options:
          type: object
          description: Configuration options specific to the data type. Possible options include an array
            of picklist options or a format for ENUM_COUNTRY or ENUM_US_STATE_TERRITORY.
        letter_case:
          type: string
          enum:
          - LETTER_CASE_TITLE
          - LETTER_CASE_UPPER
          - LETTER_CASE_LOWER
          description: Validation to check that a value is upper, lower, or proper cased.
        min_char_limit:
          type: integer
          description: Validation to check that the number of characters is at least min_char_limit.
        max_char_limit:
          type: integer
          description: Validation to check that the number of characters does not exceed max_char_limit.
        delimiter:
          type: string
          description: Column configuration to tell the system that there are multiple values per cell
            separated by the given delimiter. Example delimiters are semicolon, comma, etc.
        default_value:
          type: string
          description: A default value if uploaded values in the column are empty.
        mapping_hints:
          type: array
          items:
            type: string
          description: Array of sheet column names to automatically map this column to.
    TemplateHookSummary:
      type: object
      required:
      - key
      - type
      properties:
        key:
          type: string
          examples:
          - hook_key
        type:
          type: string
          examples:
          - code-postmapping
    TemplateHooksByStage:
      type: object
      properties:
        preparsing:
          type: array
          items:
            $ref: '#/components/schemas/TemplateHookSummary'
        postupload:
          type: array
          items:
            $ref: '#/components/schemas/TemplateHookSummary'
        postmapping:
          type: array
          items:
            $ref: '#/components/schemas/TemplateHookSummary'
        validation:
          type: array
          items:
            $ref: '#/components/schemas/TemplateHookSummary'
    ValidationHook:
      type: object
      required:
      - name
      - url
      properties:
        name:
          type: string
          examples:
          - validation_hook_name
        url:
          type: string
          description: The endpoint for the validation hook.
          examples:
          - https://example.com
        secret_key:
          type: string
          description: An optional secret for authenticating the validation hook.
        column_keys:
          type: array
          items:
            type: string
          description: The keys for the columns that are being validated by the validation hook.
          default: []
        custom_column_keys:
          type: array
          items:
            type: string
          description: The keys for the custom columns that are being validated by the validation hook.
          default: []
        include_unmapped:
          type: boolean
          description: Include columns that were not mapped to the template.
          default: false
        hook_type:
          type: string
          enum:
          - row
          - column
          description: Whether to send the data by row or by column. See [docs](https://docs.oneschema.co/docs/validation-webhook)
            for more information on hook type.
          default: row
        batch_size:
          type: integer
          description: The number of rows of data to include in each call; only applicable for validation
            webhooks with a `row` hook_type.
          default: 1000
    TemplateHooksListResponse:
      type: object
      properties:
        hooks:
          type: array
          items:
            $ref: '#/components/schemas/TemplateHook'
        total_count:
          type: integer
    BinaryString:
      type: string
      format: binary
    TemplatesListResponse:
      type: object
      properties:
        templates:
          type: array
          items:
            $ref: '#/components/schemas/Template'
    ImportTemplateResponse:
      type: object
      properties:
        id:
          type: number
    PostTemplateRequest:
      type: object
      properties:
        push_to_environments:
          type: array
          items:
            type: string
          description: Optional array of environment names that the template is pushed to. If this param
            is not set, the template will be pushed to all environments by default.
      allOf:
      - $ref: '#/components/schemas/Template'
    EnvironmentPushRequest:
      type: object
      required:
      - environments
      properties:
        environments:
          type: array
          items:
            type: string
          description: Pushing to `Production` will trigger a push to all other environments.
    TemplateSampleFileUploadRequest:
      type: object
      properties:
        file:
          description: The file that end users will download when the `includeExcelTemplate` importer
            customization is enabled. Must be one of `.xlsx`, `.xls`, `.xlsm`, `.xlsb`, `.csv` and at
            most 5 MiB.
          format: binary
          type: string
      required:
      - file
    UploadTemplateSampleFileResponse:
      type: object
      properties:
        template_key:
          type: string
          description: The key of the template the file was attached to.
        sample_file_name:
          type: string
          description: The original filename of the uploaded file.
