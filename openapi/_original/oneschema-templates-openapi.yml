openapi: 3.1.0
info:
  title: OneSchema Templates API
  version: '1'
  description: Create, read, update, export, delete, and push OneSchema Templates (output schema + validation
    rules) across environments.
  contact:
    name: OneSchema Support
    email: support@oneschema.co
  termsOfService: https://www.oneschema.co/terms-and-conditions
  license:
    name: proprietary
    url: https://www.oneschema.co/terms-and-conditions
servers:
- url: https://api.oneschema.co
  description: Production server (hosted in the US)
- url: https://api.eu.oneschema.co
  description: Production server (hosted in the EU)
- url: https://api.ca.oneschema.co
  description: Production server (hosted in Canada)
- url: https://api.au.oneschema.co
  description: Production server (hosted in Australia)
security:
- ApiKeyAuth: []
tags:
- name: Template Hooks
  description: Template Hooks operations
- name: Templates
  description: Template operations
paths:
  /v1/template-hooks:
    post:
      operationId: create-template-hook
      summary: Create a new template hook
      description: Create a new template hook.
      parameters: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateHook'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Template Hooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateHook'
            examples:
              jsonToCsvExample:
                summary: jsonToCsvExample
                value:
                  key: json_to_csv
                  stage: preparsing
                  type: json-to-csv
                  params:
                    fileExts:
                    - json
                    entryPath:
                    - path/to/entry
              xmlToCsvExample:
                summary: xmlToCsvExample
                value:
                  key: xml_to_csv
                  stage: preparsing
                  type: xml-to-csv
                  params:
                    fileExts:
                    - xml
                    entryPath:
                    - path/to/xml
              fixedWidthToCsvExample:
                summary: fixedWidthToCsvExample
                value:
                  key: fixed_width_to_csv
                  stage: preparsing
                  type: fixed-width-to-csv
                  params:
                    fileExts:
                    - txt
                    columns:
                    - label: Column1
                      start: 0
                      width: 10
                    - label: Column2
                      start: 10
                      width: 15
              advancedExcelParsingExample:
                summary: advancedExcelParsingExample
                value:
                  key: advanced_excel_parsing
                  stage: preparsing
                  type: advanced-excel-parsing
                  params:
                    fileExts:
                    - xlsx
                    ignoreScientificNotation: true
                    extractHyperlinks: false
              postuploadCodeHookExample:
                summary: postuploadCodeHookExample
                value:
                  key: postupload_code_hook
                  stage: postupload
                  type: code-postupload
                  params:
                    code: function example() { return true; }
              transposeFileExample:
                summary: transposeFileExample
                value:
                  key: transpose_file
                  stage: postupload
                  type: transpose-file
                  params: {}
              findAndReplaceExample:
                summary: findAndReplaceExample
                value:
                  key: find_and_replace
                  stage: postmapping
                  type: find-replace
                  params:
                    columns:
                    - name
                    find: old
                    caseSensitive: false
                    exactMatch: true
                    replace: new
              splitColumnExample:
                summary: splitColumnExample
                value:
                  key: split_column
                  stage: postmapping
                  type: split-column
                  params:
                    sourceColumn: fullName
                    delimiter: ' '
                    targetColumns:
                    - firstName
                    - lastName
              mergeColumnsExample:
                summary: mergeColumnsExample
                value:
                  key: merge_columns
                  stage: postmapping
                  type: merge-column
                  params:
                    sourceColumns:
                    - firstName
                    - lastName
                    targetColumn: fullName
                    delimiter: ' '
              fillEmptyExample:
                summary: fillEmptyExample
                value:
                  key: fill_empty
                  stage: postmapping
                  type: fill-empty
                  params:
                    targetColumn: address
                    sourceColumn: defaultAddress
              addColumnExample:
                summary: addColumnExample
                value:
                  key: add_column
                  stage: postmapping
                  type: add-column
                  params:
                    column: newColumn
              codePostMappingExample:
                summary: codePostMappingExample
                value:
                  key: code_post_mapping
                  stage: postmapping
                  type: code-postmapping
                  params:
                    idempotent: true
                    code: function map() { return true; }
              validationCodeHookExample:
                summary: validationCodeHookExample
                value:
                  key: validation_code_hook
                  stage: validation
                  type: code-validation
                  params:
                    columns:
                    - email
                    validationType: row
                    code: function validate() { return true; }
              multiColumnUniquenessExample:
                summary: multiColumnUniquenessExample
                value:
                  key: multi_column_uniqueness
                  stage: validation
                  type: multicolumn-uniqueness
                  params:
                    columns:
                    - email
                    - username
              rowUniquenessExample:
                summary: rowUniquenessExample
                value:
                  key: row_uniqueness
                  stage: validation
                  type: row-uniqueness
                  params:
                    caseSensitive: true
        description: Template hook configuration.
    get:
      operationId: get-template-hooks
      summary: List template hooks
      description: Returns a list of template hooks for the organization. Supports pagination via `offset`
        and `count` parameters.
      parameters:
      - name: offset
        in: query
        required: false
        description: The number of items to skip before starting to collect the result set
        schema:
          type: integer
          minimum: 0
          default: 0
        explode: false
      - name: count
        in: query
        required: false
        description: The numbers of items to return
        schema:
          type: integer
          minimum: 0
          maximum: 100
          default: 100
        explode: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateHooksListResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Template Hooks
  /v1/template-hooks/{key}:
    delete:
      operationId: delete-template-hook
      summary: Delete a template hook
      description: Delete a template hook. A template hook attached to a template cannot be deleted.
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Template Hooks
    get:
      operationId: get-template-hook
      summary: Get a template hook
      description: Get a template hook.
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateHook'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Template Hooks
    put:
      operationId: update-template-hook
      summary: Update an existing template hook
      description: Update an existing template hook. Note that updates to template hooks are live instantly.
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateHook'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Template Hooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateHook'
            examples:
              jsonToCsvExample:
                summary: jsonToCsvExample
                value:
                  key: json_to_csv
                  stage: preparsing
                  type: json-to-csv
                  params:
                    fileExts:
                    - json
                    entryPath:
                    - path/to/entry
              xmlToCsvExample:
                summary: xmlToCsvExample
                value:
                  key: xml_to_csv
                  stage: preparsing
                  type: xml-to-csv
                  params:
                    fileExts:
                    - xml
                    entryPath:
                    - path/to/xml
              fixedWidthToCsvExample:
                summary: fixedWidthToCsvExample
                value:
                  key: fixed_width_to_csv
                  stage: preparsing
                  type: fixed-width-to-csv
                  params:
                    fileExts:
                    - txt
                    columns:
                    - label: Column1
                      start: 0
                      width: 10
                    - label: Column2
                      start: 10
                      width: 15
              advancedExcelParsingExample:
                summary: advancedExcelParsingExample
                value:
                  key: advanced_excel_parsing
                  stage: preparsing
                  type: advanced-excel-parsing
                  params:
                    fileExts:
                    - xlsx
                    ignoreScientificNotation: true
                    extractHyperlinks: false
              postuploadCodeHookExample:
                summary: postuploadCodeHookExample
                value:
                  key: postupload_code_hook
                  stage: postupload
                  type: code-postupload
                  params:
                    code: function example() { return true; }
              transposeFileExample:
                summary: transposeFileExample
                value:
                  key: transpose_file
                  stage: postupload
                  type: transpose-file
                  params: {}
              findAndReplaceExample:
                summary: findAndReplaceExample
                value:
                  key: find_and_replace
                  stage: postmapping
                  type: find-replace
                  params:
                    columns:
                    - name
                    find: old
                    caseSensitive: false
                    exactMatch: true
                    replace: new
              splitColumnExample:
                summary: splitColumnExample
                value:
                  key: split_column
                  stage: postmapping
                  type: split-column
                  params:
                    sourceColumn: fullName
                    delimiter: ' '
                    targetColumns:
                    - firstName
                    - lastName
              mergeColumnsExample:
                summary: mergeColumnsExample
                value:
                  key: merge_columns
                  stage: postmapping
                  type: merge-column
                  params:
                    sourceColumns:
                    - firstName
                    - lastName
                    targetColumn: fullName
                    delimiter: ' '
              fillEmptyExample:
                summary: fillEmptyExample
                value:
                  key: fill_empty
                  stage: postmapping
                  type: fill-empty
                  params:
                    targetColumn: address
                    sourceColumn: defaultAddress
              addColumnExample:
                summary: addColumnExample
                value:
                  key: add_column
                  stage: postmapping
                  type: add-column
                  params:
                    column: newColumn
              codePostMappingExample:
                summary: codePostMappingExample
                value:
                  key: code_post_mapping
                  stage: postmapping
                  type: code-postmapping
                  params:
                    idempotent: true
                    code: function map() { return true; }
              validationCodeHookExample:
                summary: validationCodeHookExample
                value:
                  key: validation_code_hook
                  stage: validation
                  type: code-validation
                  params:
                    columns:
                    - email
                    validationType: row
                    code: function validate() { return true; }
              multiColumnUniquenessExample:
                summary: multiColumnUniquenessExample
                value:
                  key: multi_column_uniqueness
                  stage: validation
                  type: multicolumn-uniqueness
                  params:
                    columns:
                    - email
                    - username
              rowUniquenessExample:
                summary: rowUniquenessExample
                value:
                  key: row_uniqueness
                  stage: validation
                  type: row-uniqueness
                  params:
                    caseSensitive: true
        description: 'Template hook configuration.

          Key, stage, and type cannot be updated via this endpoint.'
  /v1/templates/{key}/sample-file:
    delete:
      operationId: delete-template-sample-file
      summary: Clear the custom sample file
      description: Remove the custom sample file previously attached to the template. After removal, the
        importer falls back to the sample file that OneSchema auto-generates from the template's columns.
      parameters:
      - name: key
        in: path
        required: true
        description: The key of the template whose sample file should be cleared.
        schema:
          type: string
      responses:
        '200':
          description: 'Successful response. The primary way to verify the request''s success or failure
            is the response status code.

            In a future API version this endpoint may not return any response body at all.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Templates
    get:
      operationId: get-template-sample-file
      summary: Download the template's sample file
      description: Download the template's sample file. If a custom file has been uploaded via `POST /v1/templates/{key}/sample-file`
        it is returned verbatim; otherwise OneSchema generates a sample file on the fly from the template's
        columns.
      parameters:
      - name: key
        in: path
        required: true
        description: The key of the template to download the sample file from.
        schema:
          type: string
      responses:
        '200':
          description: 'Successful response. The response''s `Content-Type` matches the file format: xlsx
            when no custom file has been uploaded (or an xlsx custom file was uploaded), and the corresponding
            MIME type for other allowed extensions (xls, xlsm, xlsb, csv).'
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                $ref: '#/components/schemas/BinaryString'
            application/vnd.ms-excel:
              schema:
                $ref: '#/components/schemas/BinaryString'
            application/vnd.ms-excel.sheet.macroEnabled.12:
              schema:
                $ref: '#/components/schemas/BinaryString'
            application/vnd.ms-excel.sheet.binary.macroEnabled.12:
              schema:
                $ref: '#/components/schemas/BinaryString'
            text/csv:
              schema:
                $ref: '#/components/schemas/BinaryString'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Templates
    post:
      operationId: upload-template-sample-file
      summary: Upload a custom sample file
      description: 'Upload a file to serve as the downloadable sample file shown to end users in the importer''s
        upload pane. When set, this file replaces the sample file that OneSchema otherwise auto-generates
        from the template''s columns. Subject to a 5 MiB file size limit. Accepted extensions: `.xlsx`,
        `.xls`, `.xlsm`, `.xlsb`, `.csv`. Requires `multipart/form-data` with a single `file` field.'
      parameters:
      - name: key
        in: path
        required: true
        description: The key of the template to attach the sample file to.
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTemplateSampleFileResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Templates
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TemplateSampleFileUploadRequest'
            encoding:
              file:
                contentType: application/octet-stream
  /v1/templates/{key}:
    delete:
      operationId: delete-template
      summary: Delete a template
      description: Delete a template.
      parameters:
      - name: key
        in: path
        required: true
        description: The key of the template to delete.
        schema:
          type: string
      responses:
        '200':
          description: 'Successful response. The primary way to verify the request''s success or failure
            is the response status code.

            In a future API version this endpoint may not return any response body at all.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Templates
    get:
      operationId: export-template
      summary: Export a template as JSON
      description: Export a template as JSON.
      parameters:
      - name: key
        in: path
        required: true
        description: The key of the template to export.
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Templates
    put:
      operationId: update-template
      summary: Update a template
      description: Update a template.
      parameters:
      - name: key
        in: path
        required: true
        description: The key of the template to update.
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Templates
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Template'
        description: Template JSON
  /v1/templates:
    get:
      operationId: get-templates
      summary: List templates
      description: Returns a list of templates for the organization. Supports pagination via `offset`
        and `count` parameters.
      parameters:
      - name: offset
        in: query
        required: false
        description: The number of items to skip before starting to collect the result set
        schema:
          type: integer
        explode: false
      - name: count
        in: query
        required: false
        description: The numbers of items to return
        schema:
          type: integer
        explode: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplatesListResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Templates
    post:
      operationId: import-template
      summary: Import a template as JSON
      description: Import a template as JSON.
      parameters: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportTemplateResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Templates
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostTemplateRequest'
        description: Template JSON
  /v1/templates/{key}/environment-push:
    post:
      operationId: push-template-environment
      summary: Push template to environment(s)
      description: Push template to environment(s).
      parameters:
      - name: key
        in: path
        required: true
        description: The key of the template to push.
        schema:
          type: string
      responses:
        '200':
          description: 'Successful response. The primary way to verify the request''s success or failure
            is the response status code.

            In a future API version this endpoint may not return any response body at all.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Templates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentPushRequest'
        description: Environment push configuration.
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
  schemas:
    AddColumnHook:
      type: object
      required:
      - key
      - stage
      - type
      - params
      properties:
        key:
          type: string
          examples:
          - add_column
        stage:
          type: string
          enum:
          - postmapping
        type:
          type: string
          enum:
          - add-column
        params:
          $ref: '#/components/schemas/AddColumnHookParams'
    AddColumnHookParams:
      type: object
      required:
      - column
      properties:
        column:
          type: string
    AdvancedExcelParsingHook:
      type: object
      required:
      - key
      - stage
      - type
      - params
      properties:
        key:
          type: string
          examples:
          - advanced_excel_parsing
        stage:
          type: string
          enum:
          - preparsing
        type:
          type: string
          enum:
          - advanced-excel-parsing
        params:
          $ref: '#/components/schemas/AdvancedExcelParsingHookParams'
    AdvancedExcelParsingHookParams:
      type: object
      required:
      - fileExts
      - ignoreScientificNotation
      - extractHyperlinks
      properties:
        fileExts:
          type: array
          items:
            type: string
        ignoreScientificNotation:
          type: boolean
        extractHyperlinks:
          type: boolean
    CodeHookParams:
      type: object
      required:
      - code
      properties:
        code:
          type: string
    EmptyParams:
      type: object
      additionalProperties: false
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
    FillEmptyHook:
      type: object
      required:
      - key
      - stage
      - type
      - params
      properties:
        key:
          type: string
          examples:
          - fill_empty
        stage:
          type: string
          enum:
          - postmapping
        type:
          type: string
          enum:
          - fill-empty
        params:
          $ref: '#/components/schemas/FillEmptyHookParams'
    FillEmptyHookParams:
      type: object
      required:
      - targetColumn
      - sourceColumn
      properties:
        targetColumn:
          type: string
        sourceColumn:
          type: string
    FindAndReplaceHook:
      type: object
      required:
      - key
      - stage
      - type
      - params
      properties:
        key:
          type: string
          examples:
          - find_and_replace
        stage:
          type: string
          enum:
          - postmapping
        type:
          type: string
          enum:
          - find-replace
        params:
          $ref: '#/components/schemas/FindAndReplaceHookParams'
    FindAndReplaceHookParams:
      type: object
      required:
      - columns
      - find
      - caseSensitive
      - exactMatch
      - replace
      properties:
        columns:
          type: array
          items:
            type: string
        find:
          type: string
        caseSensitive:
          type: boolean
        exactMatch:
          type: boolean
        replace:
          type: string
    FixedWidthColumn:
      type: object
      required:
      - label
      - start
      - width
      properties:
        label:
          type: string
        start:
          type: integer
        width:
          type: integer
    FixedWidthToCsvHook:
      type: object
      required:
      - key
      - stage
      - type
      - params
      properties:
        key:
          type: string
          examples:
          - fixed_width_to_csv
        stage:
          type: string
          enum:
          - preparsing
        type:
          type: string
          enum:
          - fixed-width-to-csv
        params:
          $ref: '#/components/schemas/FixedWidthToCsvHookParams'
    FixedWidthToCsvHookParams:
      type: object
      required:
      - fileExts
      - columns
      properties:
        fileExts:
          type: array
          items:
            type: string
        columns:
          type: array
          items:
            $ref: '#/components/schemas/FixedWidthColumn'
    JsonToCsvHook:
      type: object
      required:
      - key
      - stage
      - type
      - params
      properties:
        key:
          type: string
          examples:
          - json_to_csv
        stage:
          type: string
          enum:
          - preparsing
        type:
          type: string
          enum:
          - json-to-csv
        params:
          $ref: '#/components/schemas/JsonToCsvHookParams'
    JsonToCsvHookParams:
      type: object
      required:
      - fileExts
      - entryPath
      properties:
        fileExts:
          type: array
          items:
            type: string
        entryPath:
          type: array
          items:
            type: string
    MergeColumnsHook:
      type: object
      required:
      - key
      - stage
      - type
      - params
      properties:
        key:
          type: string
          examples:
          - merge_columns
        stage:
          type: string
          enum:
          - postmapping
        type:
          type: string
          enum:
          - merge-column
        params:
          $ref: '#/components/schemas/MergeColumnsHookParams'
    MergeColumnsHookParams:
      type: object
      required:
      - sourceColumns
      - targetColumn
      - delimiter
      properties:
        sourceColumns:
          type: array
          items:
            type: string
        targetColumn:
          type: string
        delimiter:
          type: string
    MultiColumnUniquenessHook:
      type: object
      required:
