openapi: 3.1.0
info:
  title: OneSchema Multi FileFeeds API
  version: '1'
  description: 'Manage OneSchema Multi FileFeeds: folders, feeds, imports, direct/S3 uploads, and versioned
    transform flowgraphs (HEAD, commits, history, revert).'
  contact:
    name: OneSchema Support
    email: support@oneschema.co
  termsOfService: https://www.oneschema.co/terms-and-conditions
  license:
    name: proprietary
    url: https://www.oneschema.co/terms-and-conditions
servers:
- url: https://api.oneschema.co
  description: Production server (hosted in the US)
- url: https://api.eu.oneschema.co
  description: Production server (hosted in the EU)
- url: https://api.ca.oneschema.co
  description: Production server (hosted in Canada)
- url: https://api.au.oneschema.co
  description: Production server (hosted in Australia)
security:
- ApiKeyAuth: []
tags:
- name: Multi FileFeed Imports
  description: 'Multi FileFeed Imports operations.


    NOTE: These endpoints are served under the `/v0/multi-file-feeds/` path prefix.

    The legacy `/v0/workflows/` prefix is still supported for backward compatibility

    but is deprecated and should not be used for new integrations.

    '
- name: Multi FileFeed Commits
  description: 'Manage immutable commit snapshots of a Multi FileFeed''s transforms.


    Commits are created by sending a transforms payload. The endpoint

    atomically replaces the HEAD and creates an immutable snapshot.

    Imports run against the latest commit.

    '
- name: Multi FileFeed Folders
  description: Multi FileFeed Folder operations
- name: Multi FileFeeds
  description: Multi FileFeed operations
- name: Multi FileFeed Transforms
  description: 'Manage the transforms (flowgraph nodes) of a Multi FileFeed.


    The HEAD is the mutable, editable version of the flowgraph.

    Commits are immutable snapshots of the HEAD at a point in time.

    Imports run against the latest commit.

    '
paths:
  /v0/multi-file-feeds/{multi_file_feed_id}/imports/{multi_file_feed_import_id}/direct-uploads:
    post:
      summary: Create a direct file upload for a Multi FileFeed import
      description: 'Creates a direct upload for a Multi FileFeed import. Returns an `upload_id`,

        a `presigned_url`, and a `content_type`. The client must PUT the file directly

        to the `presigned_url`, setting the returned `content_type` as the `Content-Type`

        header on the PUT request (the file store will reject the upload otherwise).


        The direct upload flow consists of three steps:

        1. **Create** (this endpoint): creates a tracking record and returns the presigned URL, content
        type, and upload ID.

        2. **Upload**: the client uploads the file directly to cloud storage using the presigned URL.

        3. **Submit** (`direct-uploads/{upload_id}/submit`): verifies the upload succeeded and links the
        file to the import.

        '
      operationId: create-direct-upload-multi-file-feed-import-file
      tags:
      - Multi FileFeed Imports
      parameters:
      - name: multi_file_feed_id
        in: path
        required: true
        schema:
          type: integer
        description: ID of the Multi FileFeed
      - name: multi_file_feed_import_id
        in: path
        required: true
        schema:
          type: integer
        description: ID of the Multi FileFeed import
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  type: string
                  description: The name of the file to upload (e.g. "data.csv"). Must be unique within
                    this import.
              required:
              - filename
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  upload_id:
                    type: integer
                    description: Unique identifier for this upload. Pass this to the `direct-uploads/{upload_id}/submit`
                      endpoint after uploading.
                  presigned_url:
                    type: string
                    format: uri
                    description: Presigned PUT URL for uploading the file directly to the file store.
                      Expires in 1 hour.
                  content_type:
                    type: string
                    description: The Content-Type that MUST be set as the `Content-Type` header on the
                      PUT request to the presigned URL.
                required:
                - upload_id
                - presigned_url
                - content_type
        '400':
          description: Bad request (e.g. duplicate filename, import already submitted, import does not
            belong to workflow)
          content:
            application/json:
              schema:
                type: object
  /v0/multi-file-feeds/{multi_file_feed_id}/commits:
    parameters:
    - name: multi_file_feed_id
      in: path
      required: true
      schema:
        type: integer
      description: ID of the Multi FileFeed
    post:
      x-readme:
        hidden: true
      summary: Create a commit
      description: 'Creates an immutable commit (snapshot) of the Multi FileFeed''s transforms.

        A request body with the transforms payload is required.


        The endpoint atomically:

        1. Checks that the HEAD is not dirty (rejects with 422 if it is)

        2. Replaces all nodes on the HEAD with the supplied payload

        3. Creates an immutable commit snapshot


        The dirty check prevents accidentally overwriting in-progress UI edits.

        If the HEAD has uncommitted changes, the API consumer must coordinate

        with the UI user before proceeding.


        This is the primary endpoint for programmatic transform management.

        Imports run against the latest commit. Immediately after this call,

        the new commit becomes the latest commit unless another commit is

        created before `POST /imports`.


        Requires Multi FileFeed transforms to be enabled for the organization.

        '
      operationId: create-multi-file-feed-commit
      tags:
      - Multi FileFeed Commits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 'Portable flowgraph payload. Uses portable identifiers

                (template_key, workflow_name, code_action_key) instead of

                internal numeric IDs.

                '
              properties:
                flowgraph:
                  type: object
                  properties:
                    nodes:
                      type: array
                      items:
                        type: object
                        properties:
                          node_key:
                            type: string
                          type:
                            type: string
                          config:
                            type: object
                          position_x:
                            type: number
                          position_y:
                            type: number
                          pipeline:
                            type: object
                            nullable: true
                    edges:
                      type: array
                      items:
                        type: object
                        properties:
                          from_node_key:
                            type: string
                          to_node_key:
                            type: string
      responses:
        '200':
          description: Successful response — returns the created commit
          content:
            application/json:
              schema:
                type: object
                properties:
                  commit_id:
                    type: integer
                    description: Unique identifier of the created commit
                  created_at:
                    type: string
                    format: date-time
                    description: When the commit was created (ISO 8601)
                  transforms:
                    type: object
                    description: The portable flowgraph export of the commit
                    properties:
                      version:
                        type: integer
                      exported_at:
                        type: string
                        format: date-time
                      flowgraph:
                        type: object
                        properties:
                          nodes:
                            type: array
                            items:
                              type: object
                          edges:
                            type: array
                            items:
                              type: object
                required:
                - commit_id
                - created_at
                - transforms
        '400':
          description: Bad request (e.g. request body is not valid JSON or JSON is not an object)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Unauthorized (missing or invalid API key)
        '403':
          description: Forbidden (wrong organization or required feature not enabled)
        '422':
          description: 'Unprocessable entity. Possible reasons:

            - HEAD flowgraph has uncommitted changes (dirty)

            - Import validation failed

            - Unresolved template/workflow references

            - Workflow has no recurring flowgraph

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable error message
    get:
      x-readme:
        hidden: true
      summary: List commits
      description: 'Returns a paginated list of commits (immutable snapshots) for the

        Multi FileFeed, ordered newest-first.


        Each entry contains the commit ID and creation timestamp.

        To retrieve a commit''s full transforms, use

        `GET /commits/{commit_id}`.


        Requires Multi FileFeed transforms to be enabled for the organization.

        '
      operationId: list-multi-file-feed-commits
      tags:
      - Multi FileFeed Commits
      parameters:
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
        description: The number of items to skip before starting to collect the result set
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: The number of items to return (default 20, max 100)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  commits:
                    type: array
                    items:
                      type: object
                      properties:
                        commit_id:
                          type: integer
                          description: Unique identifier of the commit
                        created_at:
                          type: string
                          format: date-time
                          description: When the commit was created (ISO 8601)
                      required:
                      - commit_id
                      - created_at
                  total_count:
                    type: integer
                    description: Total number of commits (before pagination)
                required:
                - commits
                - total_count
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized (missing or invalid API key)
        '403':
          description: Forbidden (wrong organization or required feature not enabled)
        '422':
          description: Unprocessable entity (e.g. workflow has no recurring flowgraph)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /v0/multi-file-feed-folders:
    post:
      summary: Create a Multi FileFeed Folder
      description: Create a new Multi FileFeed folder.
      operationId: create-multi-file-feed-folder
      tags:
      - Multi FileFeed Folders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultiFileFeedFolderPostRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiFileFeedFolder'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
    get:
      summary: List all Multi FileFeed Folders
      description: Returns a list of all Multi FileFeed folders for the organization.
      operationId: list-multi-file-feed-folders
      tags:
      - Multi FileFeed Folders
      parameters:
      - name: containing_folder_id
        in: query
        required: false
        schema:
          type: integer
          nullable: true
        description: Filter folders by the ID of the folder that contains them. Omit to return all folders.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MultiFileFeedFolder'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
  /v0/multi-file-feeds/{multi_file_feed_id}/imports:
    post:
      summary: Create a Multi FileFeed import
      description: Creates a new Multi FileFeed import for the specified Multi FileFeed
      operationId: create-multi-file-feed-import
      tags:
      - Multi FileFeed Imports
      parameters:
      - name: multi_file_feed_id
        in: path
        required: true
        schema:
          type: integer
        description: ID of the Multi FileFeed
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiFileFeedImport'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
    get:
      summary: List Multi FileFeed imports
      description: 'Returns a list of imports for the specified Multi FileFeed, ordered by

        most recent first. At most 200 imports are returned.


        Builder and workflow-called imports are excluded from the results.

        '
      operationId: list-multi-file-feed-imports
      tags:
      - Multi FileFeed Imports
      parameters:
      - name: multi_file_feed_id
        in: path
        required: true
        schema:
          type: integer
        description: ID of the Multi FileFeed
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - initialized
          - submitted
          - running
          - failed_runtime
          - failed_transforms
          - failed_validations
          - run_succeeded
        description: Optional status filter to return only imports with this status
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MultiFileFeedImport'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
  /v0/multi-file-feeds:
    post:
      x-readme:
        hidden: true
      summary: Create a Multi FileFeed
      description: 'Creates a new Multi FileFeed with the specified templates.

        At least one template must be provided. Template keys must be unique

        within the request.


        Optional parameters allow configuring a source (SFTP or S3), destination (SFTP or S3),

        event webhook, post-validation transform, and custom metadata at creation time.


        If `folder_id` is not provided, the Multi FileFeed is placed in the

        organization''s default Multi FileFeed folder.

        '
      operationId: create-multi-file-feed
      tags:
      - Multi FileFeeds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name for the new Multi FileFeed. Must be unique within the organization.
                folder_id:
                  type: integer
                  description: ID of the folder to place this Multi FileFeed in. If not provided, the
                    default Multi FileFeed folder is used.
                workflow_templates:
                  type: array
                  items:
                    $ref: '#/components/schemas/WorkflowTemplateInput'
                  description: List of templates to associate with the Multi FileFeed. At least one is
                    required. Template keys must be unique.
                  minItems: 1
                source:
                  anyOf:
                  - $ref: '#/components/schemas/SourceSftp'
                  - $ref: '#/components/schemas/SourceS3'
                  - type: 'null'
                  description: Configuration for the source connection (e.g. SFTP or S3). S3 sources must
                    be enabled for the organization.
                destination:
                  anyOf:
                  - $ref: '#/components/schemas/DestinationSftp'
                  - $ref: '#/components/schemas/DestinationS3'
                  - type: 'null'
                  description: Configuration for the destination connection (e.g. SFTP or S3). S3 destinations
                    must be enabled for the organization.
                multi_filefeed_event_webhook_key:
                  type: string
                  minLength: 1
                  description: Key of an existing event webhook to attach to this Multi FileFeed
                post_validation_transform_key:
                  type: string
                  nullable: true
                  description: Key of an existing post-validation transform to apply
                custom_metadata:
                  type:
                  - object
                  - 'null'
                  description: JSON object with custom metadata to associate with the Multi FileFeed
              required:
              - name
              - workflow_templates
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiFileFeed'
        '400':
          description: Bad request (e.g. missing name, empty templates, duplicate template keys, invalid
            webhook key)
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Forbidden (the required feature is not enabled for this organization)
          content:
            application/json:
              schema:
                type: object
    get:
      summary: List Multi FileFeeds
      description: Returns a list of Multi FileFeeds for the organization. Optionally filter by folder
        ID.
      operationId: list-multi-file-feeds
      tags:
      - Multi FileFeeds
      parameters:
      - name: folder_id
        in: query
        required: false
        schema:
          type: integer
        description: Optional folder ID to filter Multi FileFeeds by folder
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MultiFileFeedSummary'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
  /v0/multi-file-feed-folders/{folder_id}:
    parameters:
    - name: folder_id
      in: path
      required: true
      schema:
        type: integer
      description: ID of the Multi FileFeed folder
    delete:
      summary: Delete a Multi FileFeed Folder
      description: Delete a specific Multi FileFeed folder by ID.
      operationId: delete-multi-file-feed-folder
      tags:
      - Multi FileFeed Folders
      responses:
        '200':
          description: Successful response. The primary way to verify the request's success or failure
            is the response status code. In a future API version this endpoint may not return any response
            body at all.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
    get:
      summary: Get a Multi FileFeed Folder
      description: Retrieves a single Multi FileFeed folder by ID.
      operationId: get-multi-file-feed-folder
      tags:
      - Multi FileFeed Folders
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiFileFeedFolder'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
    patch:
      summary: Update a Multi FileFeed Folder
      description: Update a specific Multi FileFeed folder by ID. Only the fields that need to be updated
        should be provided.
      operationId: update-multi-file-feed-folder
      tags:
      - Multi FileFeed Folders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultiFileFeedFolderRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiFileFeedFolder'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
  /v0/multi-file-feeds/{multi_file_feed_id}:
    parameters:
    - name: multi_file_feed_id
      in: path
      required: true
      schema:
        type: integer
      description: ID of the Multi FileFeed
    delete:
      summary: Delete a Multi FileFeed
      description: Permanently deletes a Multi FileFeed
      operationId: delete-multi-file-feed
      tags:
      - Multi FileFeeds
      responses:
        '200':
          description: Successful response. The primary way to verify the request's success or failure
            is the response status code. In a future API version this endpoint may not return any response
            body at all.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
    get:
      summary: Get a Multi FileFeed
      description: Retrieves a single Multi FileFeed by ID, including its source and destination connections,
        and attached event webhooks.
      operationId: get-multi-file-feed
      tags:
      - Multi FileFeeds
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiFileFeed'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
    patch:
      summary: Update a Multi FileFeed
      description: Updates an existing Multi FileFeed's configuration
      operationId: update-multi-file-feed
      tags:
      - Multi FileFeeds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one field must be provided. If a field is not provided, it will not
                be updated. If a field is provided with a null value, it will be removed.
              properties:
                name:
                  type: string
                  description: New name for the Multi FileFeed
                source:
                  anyOf:
                  - $ref: '#/components/schemas/SourceSftp'
                  - $ref: '#/components/schemas/SourceS3'
                  - type: 'null'
                  description: Configuration for the source connection (SFTP or S3). Set to null to remove
                    the source. S3 sources must be enabled for the organization.
                destination:
                  anyOf:
                  - $ref: '#/components/schemas/DestinationSftp'
                  - $ref: '#/components/schemas/DestinationS3'
                  - type: 'null'
                  description: Configuration for the destination connection (SFTP or S3). Set to null
                    to remove the destination. S3 destinations must be enabled for the organization.
                post_validation_transform_key:
                  type: string
                  description: Key of an existing post-validation transform to apply
                multi_filefeed_event_webhook_key:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  description: Key of an existing event webhook to attach to this Multi FileFeed. Pass
                    `null` to detach the current event webhook.
                folder_id:
                  type: integer
                  description: ID of the folder to move this Multi FileFeed into. The folder must belong
                    to the same organization.
                custom_metadata:
                  type:
                  - object
                  - 'null'
                  description: JSON object with custom metadata to associate with the Multi FileFeed
                workflow_templates:
                  type: array
                  items:
                    $ref: '#/components/schemas/WorkflowTemplateInput'
                  description: 'Declarative list of templates for this Multi FileFeed. When provided,

                    the system computes a diff against the current templates:

                    - Templates in the request but not currently associated are **added**.

                    - Templates already associated whose `is_required` flag changed are **updated**.

                    - Templates currently associated but not in the request are **removed**.


                    At least one template must be provided (empty arrays are rejected).

                    Template keys must be unique within the request.

                    '
                  minItems: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiFileFeed'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Forbidden (the required feature is not enabled for this organization)
          content:
            application/json:
              schema:
                type: object
  /v0/multi-file-feeds/{multi_file_feed_id}/duplicate:
    post:
      summary: Duplicate a Multi FileFeed
      description: Duplicates a Multi FileFeed and returns the new Multi FileFeed. The copy includes both
        the builder (editable) version and the source's latest saved version, so the duplicate can run
        user imports immediately rather than only builder imports. The carried-over saved version's change
        history notes that it came from duplicating the source Multi FileFeed and when that source's latest
        version was saved.
      operationId: duplicate-multi-file-feed
      tags:
      - Multi FileFeeds
      parameters:
      - name: multi_file_feed_id
        in: path
        required: true
        schema:
          type: integer
        description: ID of the Multi FileFeed that's being duplicated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name for the duplicated Multi FileFeed
              required:
              - name
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiFileFeed'
  /v0/multi-file-feeds/{multi_file_feed_id}/commits/{commit_id}:
    parameters:
    - name: multi_file_feed_id
      in: path
      required: true
      schema:
        type: integer
      description: ID of the Multi FileFeed
    - name: commit_id
      in: path
      required: true
      schema:
        type: integer
      description: ID of the commit
    get:
      x-readme:
        hidden: true
      summary: Get a commit
      description: 'Returns the transforms for a specific commit. The commit must

        belong to this Multi FileFeed''s recurring flowgraph.


        Requires Multi FileFeed transforms to be enabled for the organization.

        '
      operationId: get-multi-file-feed-commit
      tags:
      - Multi FileFeed Commits
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  commit_id:
                    type: integer
                    description: Unique identifier of the commit
                  created_at:
                    type: string
                    format: date-time
                    description: When the commit was created (ISO 8601)
                  transforms:
                    type: object
                    description: The portable flowgraph export of the commit
                    properties:
                      version:
                        type: integer
                      exported_at:
                        type: string
                        format: date-time
                      flowgraph:
                        type: object
                        properties:
                          nodes:
                            type: array
                            items:
                              type: object
                          edges:
                            type: array
                            items:
                              type: object
                required:
                - commit_id
                - created_at
                - transforms
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized (missing or invalid API key)
        '403':
          description: Forbidden (wrong organization or required feature not enabled)
        '422':
          description: 'Unprocessable entity. Possible reasons:

            - Commit not found for this workflow

            - Workflow has no recurring flowgraph

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /v0/multi-file-feeds/{multi_file_feed_id}/head:
    parameters:
    - name: multi_file_feed_id
      in: path
      required: true
      schema:
        type: integer
      description: ID of the Multi FileFeed
    get:
      x-readme:
        hidden: true
      summary: Get HEAD state
      description: 'Returns the current HEAD (draft) flowgraph state along with its

        dirty status. The HEAD is the mutable, editable version of the

        flowgraph — it may differ from the latest commit if edits have

        been made but not yet committed.


        The `is_dirty` flag indicates whether the HEAD has changes that

        are newer than the latest commit. If `true`, `POST /commits`

        will reject requests to prevent overwriting in-progress UI edits.


        Requires Multi FileFeed transforms to be enabled for the organization.

        '
      operationId: get-multi-file-feed-head
      tags:
      - Multi FileFeed Transforms
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_dirty:
                    type: boolean
                    description: Whether the HEAD has uncommitted changes newer than the latest commit
                  transforms:
                    type: object
                    description: The portable flowgraph export
                    properties:
                      version:
                        type: integer
                        description: Export format version
                        example: 0
                      exported_at:
                        type: string
                        format: date-time
                        description: When the export was generated
                      flowgraph:
                        type: object
                        properties:
                          nodes:
                            type: array
                            items:
                              type: object
                              properties:
                                node_key:
                                  type: string
                                type:
                                  type: string
                                config:
                                  type: object
                                position_x:
                                  type: number
                                position_y:
                                  type: number
                                pipeline:
                                  type: object
                                  nullable: true
                          edges:
                            type: array
                            items:
                              type: object
                              properties:
                                from_node_key:
                                  type: string
                                to_node_key:
                                  type: string
                required:
                - is_dirty
                - transforms
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized (missing or invalid API key)
        '403':
          description: Forbidden (wrong organization or required feature not enabled)
        '422':
          description: Unprocessable entity (e.g. workflow has no recurring flowgraph)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
