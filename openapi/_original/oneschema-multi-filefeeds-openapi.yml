  /v0/multi-file-feeds/{multi_file_feed_id}/transforms:
    parameters:
    - name: multi_file_feed_id
      in: path
      required: true
      schema:
        type: integer
      description: ID of the Multi FileFeed
    get:
      summary: Get transforms
      description: "Returns the current HEAD flowgraph state using the v1 transforms format.\n\nThe response\
        \ includes the portable flowgraph export (nodes, edges, pipelines),\nthe dirty status (and the\
        \ last commit ID if there is at least one commit) \nfor optimistic locking.\n\nRequires Multi\
        \ FileFeed transforms to be enabled for the organization.\n"
      operationId: get-multi-file-feed-transforms
      tags:
      - Multi FileFeed Transforms
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_dirty:
                    type: boolean
                    description: Whether the HEAD has uncommitted changes
                  last_commit_id:
                    type: integer
                    description: ID of the latest commit (for optimistic locking)
                  transforms:
                    type: object
                    description: The portable flowgraph export in v1 format
                    properties:
                      version:
                        type: integer
                        description: Export format version (always 1)
                        example: 1
                      flowgraph:
                        type: object
                        properties:
                          nodes:
                            type: array
                            items:
                              type: object
                          edges:
                            type: array
                            items:
                              type: object
                      workflow:
                        type: object
                        description: 'Workflow-level metadata. Present on every response.

                          `workspace_key` is read-only and not accepted by PATCH.

                          '
                        properties:
                          name:
                            type: string
                            description: Workflow display name
                          workspace_key:
                            type: string
                            description: Name of the workspace this workflow belongs to (read-only)
                          workflow_event_webhook_key:
                            type: string
                            description: Key of the event webhook attached to this workflow
                          workflow_code_action_key:
                            type: string
                            description: Key of the code action attached to this workflow
                          custom_metadata:
                            type: object
                            description: Arbitrary JSON metadata stored on the workflow
                      templates:
                        type: array
                        description: 'Template associations for this workflow. Controls which templates

                          appear in the Multi FileFeed template selector.

                          Distinct from node-level `pipeline.template_key`.

                          '
                        items:
                          type: object
                          properties:
                            template_key:
                              type: string
                              description: Portable key of the associated template
                            is_required:
                              type: boolean
                              description: Whether this template is required for the workflow to run
                required:
                - is_dirty
                - transforms
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (feature not enabled)
        '422':
          description: Workflow has no recurring flowgraph
    patch:
      summary: Patch transforms
      description: "Replaces the Multi FileFeed's HEAD flowgraph with the supplied state.\n\nThe `flowgraph.nodes`\
        \ and `flowgraph.edges` arrays represent the complete\ndesired state — nodes absent from the payload\
        \ are deleted, and edges are\nfully replaced. Every call must include a `source` node and an `import`\
        \ or\n`import-v2` node or the request will be rejected. Represent the complete\nworkflow as a\
        \ single graph.\n\nWithin an individual node, `config` uses merge semantics:\n\nIf a key is not\
        \ specified, the current value is left unchanged.\nIf a key takes a scalar value\n- a supplied\
        \ value replaces the current value\n- a null value deletes the key\nIf a key takes an array value\n\
        - supplied value replaces the current array\n- a null value deletes the key\nIf a key takes a\
        \ hash/object value\n- the supplied hash is recursively merged with the current hash (same rules\
        \ apply at each nested level)\n- a null value deletes the key\n\nAuto-commits by default. Use\
        \ `commit_now: false` to defer committing.\n\nConcurrency guards:\n  - `last_known_commit_id`\
        \ — optimistic lock; 409 if commits changed\n  - Dirty-state check — 409 if HEAD has uncommitted\
        \ UI edits (override with `force: true`)\n\nRequires Multi FileFeed transforms to be enabled for\
        \ the organization.\n"
      operationId: patch-multi-file-feed-transforms
      tags:
      - Multi FileFeed Transforms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - version
              - flowgraph
              properties:
                version:
                  type: integer
                  description: Payload format version (must be 1)
                  example: 1
                commit_now:
                  type: boolean
                  description: Whether to auto-commit after applying (default true)
                  default: true
                force:
                  type: boolean
                  description: Override dirty-state check when commit_now is true
                  default: false
                last_known_commit_id:
                  type: integer
                  description: Optimistic lock — rejects if latest commit differs
                workflow:
                  type: object
                  description: 'Optional workflow-level metadata to update. Object-merge semantics:

                    only keys present are updated; absent keys leave current values

                    unchanged. `workspace_key` is read-only and ignored if supplied.

                    '
                  properties:
                    name:
                      type: string
                      description: New display name for the workflow
                    workflow_event_webhook_key:
                      type: string
                      description: Key of the event webhook to attach (null to detach)
                    workflow_code_action_key:
                      type: string
                      description: Key of the code action to attach (null to detach)
                    custom_metadata:
                      type: object
                      description: Arbitrary JSON metadata (null to clear)
                templates:
                  type: array
                  description: 'Optional full-replace list of template associations for this workflow.

                    When present, replaces all existing associations — entries absent from

                    the array are removed. Omit the field entirely to leave associations

                    unchanged.

                    '
                  items:
                    type: object
                    required:
                    - template_key
                    - is_required
                    properties:
                      template_key:
                        type: string
                        description: Portable key of the template to associate
                      is_required:
                        type: boolean
                        description: Whether this template is required for the workflow to run
                flowgraph:
                  type: object
                  required:
                  - nodes
                  - edges
                  properties:
                    nodes:
                      type: array
                      description: 'Complete desired set of nodes. Every call must include a `source`

                        node and at least one `import` or `import-v2` node. Nodes absent

                        from this array are deleted.

                        '
                      items:
                        type: object
                        required:
                        - node_key
                        - type
                        - config
                        properties:
                          node_key:
                            type: string
                            description: Unique identifier for the node within this flowgraph
                          type:
                            type: string
                            description: Node type (e.g. source, import-v2, sheet-transforms)
                          config:
                            type: object
                            description: Node-specific configuration (merge semantics — see above)
                          position_x:
                            type: number
                            description: X coordinate in the visual editor
                          position_y:
                            type: number
                            description: Y coordinate in the visual editor
                          pipeline:
                            type: object
                            description: Pipeline configuration (for single-list nodes only)
                            properties:
                              template_key:
                                type: string
                                description: Template key reference
                              config:
                                type: object
                                description: Pipeline step configuration
                              prompt_generated_code_actions:
                                type: array
                                items:
                                  type: object
                                  required:
                                  - key
                                  - label
                                  - user_prompt
                                  - code
                                  properties:
                                    key:
                                      type: string
                                    label:
                                      type: string
                                    user_prompt:
                                      type: string
                                    code:
                                      type: string
                    edges:
                      type: array
                      description: Complete desired set of edges. Fully replaced on every call.
                      items:
                        type: object
                        required:
                        - from_node_key
                        - to_node_key
                        properties:
                          from_node_key:
                            type: string
                            description: Source node key
                          to_node_key:
                            type: string
                            description: Target node key
            examples:
              minimal_two_node_graph:
                summary: Minimal valid graph (source → import-v2)
                value:
                  version: 1
                  flowgraph:
                    nodes:
                    - node_key: source
                      type: source
                      config: {}
                    - node_key: import
                      type: import-v2
                      config: {}
                    edges:
                    - from_node_key: source
                      to_node_key: import
      responses:
        '200':
          description: Successfully patched transforms
          content:
            application/json:
              schema:
                type: object
                properties:
                  transforms:
                    type: object
                    description: Full transforms state after patch
                  commit_id:
                    type: integer
                    description: ID of the created commit (if commit_now was true)
                  created_at:
                    type: string
                    format: date-time
                    description: When the commit was created
        '400':
          description: Bad request (invalid JSON or not an object)
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (feature not enabled or wrong org)
        '409':
          description: Conflict — concurrent modification detected
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      last_known_commit_id:
                        type: integer
                      current_commit_id:
                        type: integer
                      is_dirty:
                        type: boolean
        '422':
          description: Validation failed (schema, references, or graph errors)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      errors:
                        type: array
                        items:
                          type: string
  /v0/multi-file-feeds/{multi_file_feed_id}/commits/{commit_id}/revert:
    parameters:
    - name: multi_file_feed_id
      in: path
      required: true
      schema:
        type: integer
      description: ID of the Multi FileFeed
    - name: commit_id
      in: path
      required: true
      schema:
        type: integer
      description: ID of the commit to revert to
    post:
      x-readme:
        hidden: true
      summary: Revert to a commit
      description: 'Reverts the HEAD flowgraph to the state of a specific commit,

        then creates a new commit from the reverted HEAD.


        The target commit must belong to this Multi FileFeed''s recurring

        flowgraph. The response contains the newly created commit (not

        the original target commit).


        Requires Multi FileFeed transforms to be enabled for the organization.

        '
      operationId: revert-multi-file-feed-commit
      tags:
      - Multi FileFeed Commits
      responses:
        '200':
          description: Successful response — returns the newly created commit
          content:
            application/json:
              schema:
                type: object
                properties:
                  commit_id:
                    type: integer
                    description: Unique identifier of the newly created commit
                  created_at:
                    type: string
                    format: date-time
                    description: When the new commit was created (ISO 8601)
                  transforms:
                    type: object
                    description: The portable flowgraph export of the new commit
                    properties:
                      version:
                        type: integer
                      exported_at:
                        type: string
                        format: date-time
                      flowgraph:
                        type: object
                        properties:
                          nodes:
                            type: array
                            items:
                              type: object
                          edges:
                            type: array
                            items:
                              type: object
                required:
                - commit_id
                - created_at
                - transforms
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized (missing or invalid API key)
        '403':
          description: Forbidden (wrong organization or required feature not enabled)
        '422':
          description: 'Unprocessable entity. Possible reasons:

            - HEAD flowgraph has uncommitted changes (dirty)

            - Commit not found for this workflow

            - Workflow has no recurring flowgraph

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /v0/multi-file-feeds/{multi_file_feed_id}/imports/{multi_file_feed_import_id}/direct-uploads/{upload_id}/submit:
    post:
      summary: Submit a direct file upload for a Multi FileFeed import
      description: 'Submits (finalizes) a direct upload that was previously created via the

        `direct-uploads` endpoint. The `upload_id` is provided as a path parameter.

        The server verifies that the file was actually uploaded to the file store,

        updates the file size from storage metadata, and creates the record linking

        the file to this import.


        The direct upload flow consists of three steps:

        1. **Create** (`direct-uploads`): creates a tracking record and returns the presigned URL, content
        type, and upload ID.

        2. **Upload**: the client uploads the file directly to cloud storage using the presigned URL.

        3. **Submit** (this endpoint): verifies the upload succeeded and links the file to the import.

        '
      operationId: submit-direct-upload-multi-file-feed-import-file
      tags:
      - Multi FileFeed Imports
      parameters:
      - name: multi_file_feed_id
        in: path
        required: true
        schema:
          type: integer
        description: ID of the Multi FileFeed
      - name: multi_file_feed_import_id
        in: path
        required: true
        schema:
          type: integer
        description: ID of the Multi FileFeed import
      - name: upload_id
        in: path
        required: true
        schema:
          type: integer
        description: ID of the direct upload (returned from the create endpoint)
      responses:
        '200':
          description: Successful response — the file has been verified and linked to the import
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request (e.g. invalid upload_id, file not found in store, import already submitted)
          content:
            application/json:
              schema:
                type: object
        '409':
          description: Conflict (e.g. a file with the same name already exists in this import)
          content:
            application/json:
              schema:
                type: object
        '422':
          description: Unprocessable entity (e.g. this upload has already been submitted)
          content:
            application/json:
              schema:
                type: object
  /v0/multi-file-feeds/{multi_file_feed_id}/imports/{multi_file_feed_import_id}/submit:
    post:
      summary: Submit a Multi FileFeed import
      description: Submits the Multi FileFeed import for processing
      operationId: submit-multi-file-feed-import
      tags:
      - Multi FileFeed Imports
      parameters:
      - name: multi_file_feed_id
        in: path
        required: true
        schema:
          type: integer
        description: ID of the Multi FileFeed
      - name: multi_file_feed_import_id
        in: path
        required: true
        schema:
          type: integer
        description: ID of the Multi FileFeed import
      - name: prioritize
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: 'When `true`, this import''s run is placed at the front of the processing queue so
          it is picked up ahead of other Multi FileFeed imports already waiting in the queue. Omit it
          or send `false` to use the default first-in, first-out ordering.


          This option must be enabled for your organization. If it is not enabled and you send `true`,
          the request is rejected with a `403` and no run is scheduled.


          Front-of-queue ordering only affects imports that are still waiting. It does not preempt runs
          that are already executing and does not bypass concurrency limits, so a prepended run still
          waits its turn against any active throttle.

          '
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiFileFeedImport'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
        '403':
          description: 'Forbidden — `prioritize=true` was sent but front-of-queue submission is not enabled
            for the organization.

            '
          content:
            application/json:
              schema:
                type: object
  /v0/multi-file-feeds/{multi_file_feed_id}/imports/{multi_file_feed_import_id}/upload-from-s3:
    post:
      summary: Upload a file from S3 to a Multi FileFeed import
      description: 'Uploads a file from a customer''s S3 bucket into a Multi FileFeed import.

        The server assumes an IAM role to read the specified S3 object, verifies

        it exists and is within the file size limit, downloads it, and stores it

        as an uploaded file on the import.


        The `object_uri` must be a valid S3 URI in the format `s3://bucket/key`.

        The `s3_account_id` identifies which S3 account credentials (role ARN and

        external ID) to use for the STS AssumeRole call. The referenced bucket

        and object must be accessible to the IAM role configured on that S3 account.


        Both the object URI and the file basename (derived from the S3 key) must

        be unique within the import. If either already exists, a 409 Conflict is

        returned.

        '
      operationId: upload-from-s3-multi-file-feed-import
      tags:
      - Multi FileFeed Imports
      parameters:
      - name: multi_file_feed_id
        in: path
        required: true
        schema:
          type: integer
        description: ID of the Multi FileFeed
      - name: multi_file_feed_import_id
        in: path
        required: true
        schema:
          type: integer
        description: ID of the Multi FileFeed import
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                s3_account_id:
                  type: integer
                  description: 'The ID of the S3 account to use for accessing the S3 object.

                    The S3 account stores the IAM role ARN and external ID used

                    for the STS AssumeRole call.

                    '
                object_uri:
                  type: string
                  description: 'The S3 URI of the file to upload (e.g. `s3://bucket/path/to/file.csv`).

                    The bucket and object must be accessible to the IAM role

                    configured on the specified S3 account.

                    '
              required:
              - s3_account_id
              - object_uri
      responses:
        '200':
          description: Successful response. The file has been downloaded from S3 and stored on the import.
            The primary way to verify the request's success or failure is the response status code. In
            a future API version this endpoint may return additional metadata about the uploaded file.
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: false
        '400':
          description: 'Bad request. Possible causes: invalid S3 URI format, S3 object not accessible
            (not found, forbidden, or access denied), object exceeds the file size limit, import already
            submitted, or import does not belong to the specified Multi FileFeed.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  param:
                    type: string
                  message:
                    type: string
        '409':
          description: Conflict. A file with the same object URI or the same filename (basename of the
            S3 key) has already been uploaded to this import.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '500':
          description: Internal server error. A platform-level failure occurred during the S3 upload flow
            (e.g. STS role assumption failed due to a misconfigured intermediate role, or an unexpected
            AWS service error). These errors indicate an infrastructure issue rather than a problem with
            the request parameters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /v0/multi-file-feeds/{multi_file_feed_id}/imports/{multi_file_feed_import_id}/uploaded-files:
    post:
      summary: Upload a file for Multi FileFeed import
      description: Uploads a file to be used in the Multi FileFeed import
      operationId: upload-multi-file-feed-import-file
      tags:
      - Multi FileFeed Imports
      parameters:
      - name: multi_file_feed_id
        in: path
        required: true
        schema:
          type: integer
        description: ID of the Multi FileFeed
      - name: multi_file_feed_import_id
        in: path
        required: true
        schema:
          type: integer
        description: ID of the Multi FileFeed import
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload
              required:
              - file
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
  schemas:
    MultiFileFeedFolder:
      type: object
      properties:
        id:
          type: integer
          description: The unique identifier of the Multi FileFeed folder
        name:
          type: string
          description: The name of the Multi FileFeed folder
        description:
          type: string
          nullable: true
          description: The description of the Multi FileFeed folder
        color:
          type: string
          nullable: true
          description: Color associated with the folder
        custom_metadata:
          type: object
          nullable: true
          description: Custom metadata associated with the folder
        containing_folder_id:
          type: integer
          nullable: true
          description: ID of the folder that contains this folder. Null for root folders.
    MultiFileFeedFolderRequest:
      type: object
      properties:
        name:
          type: string
          description: The name of the Multi FileFeed folder
        description:
          type: string
          nullable: true
          description: The description of the Multi FileFeed folder
        color:
          type: string
          nullable: true
          description: Color associated with the folder
        custom_metadata:
          type: object
          nullable: true
          description: Custom metadata associated with the folder
        containing_folder_id:
          type: integer
          nullable: true
          description: ID of the folder that should contain this folder. Null for root folders.
    MultiFileFeedFolderPostRequest:
      allOf:
      - $ref: '#/components/schemas/MultiFileFeedFolderRequest'
      required:
      - name
    MultiFileFeedImport:
      type: object
      properties:
        id:
          type: integer
          description: The unique identifier of the Multi FileFeed import
        multi_file_feed_id:
          type: integer
          description: The ID of the associated Multi FileFeed
        environment:
          type: string
          description: The name of the environment
        status:
          type: string
          description: The current status of the Multi FileFeed import
        created_at:
          type: string
          format: date-time
          description: When the Multi FileFeed import was created
    MultiFileFeedTemplate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        key:
          type: string
        is_required:
          type: boolean
          description: Whether this template is required for the Multi FileFeed
    SourceSftp:
      type: object
      properties:
        type:
          type: string
          enum:
          - sftp
        data:
          type: object
          properties:
            sftp_account_id:
              type: integer
            path:
              type: string
              format: path
            options:
              type: object
              properties:
                schedule:
                  type: object
                  properties:
                    frequency:
                      type: string
                      enum:
                      - hourly
                      - daily
                    hour_utc:
                      type: integer
                      minimum: 0
                      maximum: 23
                      description: Hour in UTC for daily frequency
                    minute_utc:
                      type: integer
                      minimum: 0
                      maximum: 55
                      multipleOf: 5
                      description: Minute offset within the hour (must be a multiple of 5, 0-55). Defaults
                        to 0 (top of the hour).
          required:
          - sftp_account_id
          - path
    SourceS3:
      type: object
      properties:
        type:
          type: string
          enum:
          - s3
        data:
          type: object
          properties:
            s3_account_id:
              type: integer
            bucket:
              type: string
            prefix:
              type: string
              nullable: true
              description: Key prefix within the bucket to scope listing/pulling to. Defaults to empty
                (whole bucket).
            file_filter:
              type: string
              nullable: true
              description: 'Optional regular expression applied to object keys. When set, only matching
                keys are ingested.

                Note: changing `file_filter` does not retroactively re-ingest objects that already passed
                the

                cursor watermark; only newly listed objects are evaluated against the new pattern. Changing

                `bucket` or `prefix`, by contrast, resets the cursor and dedupe ledger because they reference

                a different object namespace.

                '
            options:
              type: object
              properties:
                schedule:
                  type: object
                  properties:
                    frequency:
                      type: string
                      enum:
                      - hourly
                      - daily
                    hour_utc:
                      type: integer
                      minimum: 0
                      maximum: 23
                      description: Hour in UTC for daily frequency
                    minute_utc:
                      type: integer
                      minimum: 0
                      maximum: 55
                      multipleOf: 5
                      description: Minute offset within the hour (must be a multiple of 5, 0-55). Defaults
                        to 0 (top of the hour).
          required:
          - s3_account_id
          - bucket
    DestinationSftp:
      type: object
      properties:
        type:
          type: string
          enum:
          - sftp
        data:
          type: object
          properties:
            sftp_account_id:
              type: integer
            path:
              type: string
              format: path
          required:
          - sftp_account_id
          - path
    DestinationS3:
      type: object
      properties:
        type:
          type: string
          enum:
          - s3
        data:
          type: object
          properties:
            s3_account_id:
              type: integer
            bucket:
              type: string
            prefix:
              type: string
              nullable: true
              description: Key prefix within the bucket. Output files are written to `{prefix}/{file_name}`.
                Defaults to empty (write to bucket root).
          required:
          - s3_account_id
          - bucket
    WorkflowTemplateInput:
      type: object
      description: 'A template to associate with a Multi FileFeed.

        At least one of `template_key` or `template_id` must be provided.

        If both are provided, they must refer to the same template;

        otherwise the request is rejected with a validation error.

        '
      anyOf:
      - required:
        - template_key
      - required:
        - template_id
      properties:
        template_key:
          type: string
          description: The unique key of the template to associate
        template_id:
          type: integer
          description: The numeric ID of the template to associate
        is_required:
          type: boolean
          description: Whether this template is required for the Multi FileFeed
      required:
      - is_required
    EventWebhook:
      type: object
      properties:
        webhook_key:
          type: string
          description: Unique key identifying the webhook
        events:
          type: array
          items:
            type: string
          description: List of event types the webhook is subscribed to
    MultiFileFeed:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        folder_id:
          type: integer
          description: ID of the folder containing this Multi FileFeed
        custom_metadata:
          type: object
        templates:
          type: array
          items:
            $ref: '#/components/schemas/MultiFileFeedTemplate'
        source:
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/SourceSftp'
            - $ref: '#/components/schemas/SourceS3'
        destination:
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/DestinationSftp'
            - $ref: '#/components/schemas/DestinationS3'
        event_webhooks:
          type: array
          items:
            $ref: '#/components/schemas/EventWebhook'
        post_validation_transform_key:
          type: string
          nullable: true
          description: Key of the post-validation transform applied to this Multi FileFeed
    ImportedFile:
      type: object
      properties:
        id:
          type: integer
          description: The unique identifier of the imported file
        name:
          type: string
          description: The name of the imported file
    MultiFileFeedSummary:
      type: object
      properties:
        id:
          type: integer
          description: The unique identifier of the Multi FileFeed
        name:
          type: string
          description: The name of the Multi FileFeed
        folder:
          type: object
          properties:
            id:
              type: integer
              description: The ID of the folder containing this Multi FileFeed
            name:
              type: string
              description: The name of the folder
        templates:
          type: array
          items:
            type: object
            properties:
              template_key:
                type: string
                description: The unique key of the template
              is_required:
                type: boolean
                description: Whether this template is required for the Multi FileFeed
