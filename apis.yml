aid: oneschema
name: Oneschema
description: OneSchema is an embeddable data onboarding and file-import platform for developers. Its core
  Importer embeds a guided CSV and spreadsheet upload experience — file upload, header detection, AI-assisted
  column mapping, and row-level validation against reusable Templates — directly inside a customer-facing
  product, so end users import clean, schema-compliant data in minutes. Beyond the embedded Importer,
  OneSchema offers Multi FileFeeds for automating recurring, transformation-heavy file ingestion pipelines
  (SFTP, S3, Google Drive/Sheets, Salesforce, SQL sources; AI file and PDF transforms; validation and
  delivery), a REST API at api.oneschema.co for headless importer sessions, templates, sheets, webhooks
  and connections, first-party JavaScript/React/Angular/Vue SDKs, and a hosted MCP server for AI coding
  assistants.
